name: Mirror main to gh-pages

# GitHub Pages for this repo is served from the gh-pages branch (root).
# Every push to main is mirrored to gh-pages so updating status.json on main republishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
